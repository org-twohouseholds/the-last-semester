buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.9.3"
    classpath "com.github.spotbugs.snom:spotbugs-gradle-plugin:6.5.13"
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects - project(':android')) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 17
  java.targetCompatibility = 17

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'The Last Semester'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'The Last Semester' + '-parent'

// Code quality reports (Checkstyle, SpotBugs, JaCoCo) for all Java modules.
// Report-only for now: findings never fail the build.
subprojects {
  plugins.withId('java') {
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'jacoco'

    checkstyle {
      toolVersion = '11.1.0'
      configFile = rootProject.file('config/checkstyle/checkstyle.xml')
      ignoreFailures = true
      maxWarnings = Integer.MAX_VALUE
    }

    spotbugs {
      ignoreFailures = true
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
      reports {
        html.required = true
      }
    }

    tasks.withType(Checkstyle).configureEach {
      reports {
        html.required = true
        xml.required = true
      }
    }

    tasks.named('jacocoTestReport') {
      reports {
        xml.required = true
        html.required = true
      }
    }
    tasks.named('test') {
      finalizedBy tasks.named('jacocoTestReport')
    }
  }
}
