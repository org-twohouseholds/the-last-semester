name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Report-only: findings do not fail the build (ignoreFailures in build.gradle).
      - name: Run Checkstyle, SpotBugs and tests with coverage
        run: >
          ./gradlew
          core:checkstyleMain lwjgl3:checkstyleMain server:app:checkstyleMain
          core:spotbugsMain lwjgl3:spotbugsMain server:app:spotbugsMain
          core:test lwjgl3:test server:app:test
          --continue

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Code quality report"
            echo
            for f in $(find . -path '*/build/reports/checkstyle/main.xml'); do
              echo "- Checkstyle \`$f\`: $(grep -c '<error ' "$f") warnings"
            done
            if ls ./*/build/reports/jacoco/test/jacocoTestReport.xml ./server/*/build/reports/jacoco/test/jacocoTestReport.xml >/dev/null 2>&1; then
              echo "- JaCoCo reports generated (see artifact)"
            else
              echo "- JaCoCo: no coverage data (no tests found)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/build/reports/checkstyle/
            **/build/reports/spotbugs/
            **/build/reports/jacoco/
          if-no-files-found: warn
